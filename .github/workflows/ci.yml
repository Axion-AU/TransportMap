name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run every Wednesday morning at 3:00 AM UTC (when PTV feeds are typically updated)
    - cron: '0 3 * * 3'
  workflow_dispatch:

jobs:
  build-and-process:
    name: Download, Process GTFS & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Rust unit tests
        run: cargo test --release

      - name: Download and prepare GTFS data
        run: ./scripts/download-gtfs.sh

      - name: Run GTFS processor (Rust)
        run: cargo run --release --bin process_gtfs

      - name: Run Feeder-Network Designer (Rust)
        run: cargo run --release --bin design_network

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend (Derive Suburbs, Prerender & Check)
        env:
          VITE_SITE_ORIGIN: https://transportscore.fusionparty.org.au # fallback or production domain
        run: |
          cd frontend
          npm run build
